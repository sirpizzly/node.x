<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q&A helper</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  html,body{height:100%;margin:0;background:#16161d;color:#eee}
  body{display:flex;flex-direction:column}
  .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid #2a2a35;font-size:12px}
  .bar .s{flex:1;color:#9aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{border:0;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;background:#2a2a35;color:#eee}
  button:hover{background:#3a3a48}.pri{background:#4f46e5}.pri:hover{background:#6366f1}
  #out{flex:1;overflow:auto;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .row{display:flex;gap:6px;padding:8px;border-top:1px solid #2a2a35}
  .row input{flex:1;border:1px solid #333;background:#0f0f14;color:#eee;border-radius:6px;padding:7px 9px;font-size:13px}
</style></head>
<body>
  <div class="bar">
    <span class="s" id="st">No tab chosen</span>
    <button class="pri" id="pick">Choose tab</button>
    <button id="redo" disabled>Refresh</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="out">Click “Choose tab”, pick the tab or window you want me to read, and I’ll list the questions and answers.
Then switch to that tab. Click Refresh any time to read it again.</div>
  <div class="row"><input id="q" placeholder="Ask about what's on that tab…"><button class="pri" id="ask">Ask</button></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ENDPOINT = params.get("e") || "https://YOUR-WORKER.workers.dev";
  const DEFAULT = "List every question on this page, each followed by its answer.";
  const $ = (id) => document.getElementById(id);
  const out = $("out"), st = $("st");
  let stream = null, busy = false;
  const video = document.createElement("video"); video.muted = true; video.playsInline = true;

  function state() {
    const on = !!(stream && stream.active);
    st.textContent = on ? "Reading: " + (stream.getVideoTracks()[0].label || "shared tab") : "No tab chosen";
    $("pick").textContent = on ? "Switch tab" : "Choose tab";
    $("redo").disabled = $("stop").disabled = !on;
  }
  async function pick() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    // selfBrowserSurface:"exclude" hides this popup from the picker so you can't pick it by mistake
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: false, selfBrowserSurface: "exclude" });
    video.srcObject = stream; await video.play();
    stream.getVideoTracks()[0].addEventListener("ended", () => { stream = null; state(); });
    state();
  }
  async function run(prompt) {
    if (busy) return;
    if (!stream || !stream.active) { out.textContent = "Choose a tab first."; return; }
    busy = true; out.textContent = "Reading the tab…";
    try {
      const k = Math.min(1, 1600 / video.videoWidth), c = document.createElement("canvas");
      c.width = Math.round(video.videoWidth * k); c.height = Math.round(video.videoHeight * k);
      c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
      const image = c.toDataURL("image/jpeg", 0.8).split(",")[1];
      out.textContent = "Thinking…";
      const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image, prompt }) });
      const data = await res.json().catch(() => ({}));
      out.textContent = res.ok ? data.text : "Error: " + (data.error || res.status);
    } catch (e) { out.textContent = "Error: " + e.message; }
    finally { busy = false; }
  }
  $("pick").onclick = async () => {
    try { await pick(); await run(DEFAULT); }
    catch (e) { if (e.name !== "NotAllowedError") out.textContent = "Error: " + e.message; }
  };
  $("redo").onclick = () => run(DEFAULT);
  $("stop").onclick = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; state(); };
  const ask = () => { const v = $("q").value.trim(); if (v) { $("q").value = ""; run(v); } };
  $("ask").onclick = ask;
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  if (ENDPOINT.includes("YOUR-WORKER")) out.textContent = "No Worker URL set. Open this from the site (it passes the URL), or edit ENDPOINT in ai.html.";
})();
</script></body></html>
